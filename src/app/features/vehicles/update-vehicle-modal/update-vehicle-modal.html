<!-- EDIT VEHICLE MODAL -->
<div class="modal fade" [id]="'updateVehicleModal-' + vehicleId" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Vehicle</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" *ngIf="editVehicle">

                <!-- BASIC INFO -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <label>Name</label>
                        <input class="form-control" [(ngModel)]="editVehicle.name" disabled>
                    </div>

                    <div class="col-md-6">
                        <label>Model</label>
                        <input class="form-control" [(ngModel)]="editVehicle.model" disabled>
                    </div>

                    <div class="col-md-4">
                        <label>Year</label>
                        <input type="number" class="form-control" [(ngModel)]="editVehicle.year" disabled>
                    </div>

                    <div class="col-md-4">
                        <label>Price</label>
                        <input type="number" class="form-control" [(ngModel)]="editVehicle.price">
                    </div>

                    <div class="col-md-4">
                        <label>Currency</label>
                        <input class="form-control" [(ngModel)]="editVehicle.currency">
                    </div>
                </div>

                <!-- EXISTING IMAGES -->
                <h6 class="mt-4">Images</h6>
                <div class="d-flex flex-wrap gap-2">
                    <div *ngFor="let img of editVehicle.images" class="position-relative">
                        <img [src]="img" width="120" class="border rounded">
                        <button class="btn btn-sm btn-danger position-absolute top-0 end-0" (click)="removeImage(img)">
                            ×
                        </button>
                    </div>
                </div>

                <!-- ADD NEW IMAGES -->
                <input type="file" class="form-control mt-3" multiple (change)="onNewImages($event)">

                <!-- NEW IMAGE PREVIEWS -->
                <h6 class="mt-3">New Images</h6>
                <div class="d-flex flex-wrap gap-2">
                    <div *ngFor="let img of newImagePreviews" class="position-relative">
                        <img [src]="img.url" width="120" class="border rounded">

                        <button class="btn btn-sm btn-danger position-absolute top-0 end-0"
                            (click)="removeNewImage(img.file)">
                            ×
                        </button>
                    </div>
                </div>


                <!-- DESCRIPTIONS -->
                <textarea class="form-control mt-3" rows="3" [(ngModel)]="editVehicle.shortDescription">
        </textarea>

                <textarea class="form-control mt-2" rows="5" [(ngModel)]="editVehicle.detailedDescription">
        </textarea>

                <hr class="my-4">

                <!-- SPECIFICATIONS -->
                <h5>Specifications</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label>Engine</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.engine">
                    </div>

                    <div class="col-md-4">
                        <label>Power</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.power">
                    </div>

                    <div class="col-md-4">
                        <label>Torque</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.torque">
                    </div>

                    <div class="col-md-4">
                        <label>Fuel Type</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.fuelType">
                    </div>

                    <div class="col-md-4">
                        <label>Transmission</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.transmission">
                    </div>

                    <div class="col-md-4">
                        <label>Mileage</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.mileage">
                    </div>

                    <div class="col-md-4">
                        <label>Top Speed</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.topSpeed">
                    </div>

                    <div class="col-md-4">
                        <label>Acceleration</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.acceleration">
                    </div>

                    <div class="col-md-4">
                        <label>Body Type</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.bodyType">
                    </div>

                    <div class="col-md-4">
                        <label>Drivetrain</label>
                        <input class="form-control" [(ngModel)]="editVehicle.specifications.drivetrain">
                    </div>

                    <div class="col-md-4">
                        <label>Seating</label>
                        <input type="number" class="form-control" [(ngModel)]="editVehicle.specifications.seating">
                    </div>
                </div>

                <hr class="my-4">

                <!-- DIMENSIONS -->
                <h5>Dimensions</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label>Length</label>
                        <input class="form-control" [(ngModel)]="editVehicle.dimensions.length">
                    </div>

                    <div class="col-md-4">
                        <label>Width</label>
                        <input class="form-control" [(ngModel)]="editVehicle.dimensions.width">
                    </div>

                    <div class="col-md-4">
                        <label>Height</label>
                        <input class="form-control" [(ngModel)]="editVehicle.dimensions.height">
                    </div>

                    <div class="col-md-4">
                        <label>Wheelbase</label>
                        <input class="form-control" [(ngModel)]="editVehicle.dimensions.wheelbase">
                    </div>

                    <div class="col-md-4">
                        <label>Boot Space</label>
                        <input class="form-control" [(ngModel)]="editVehicle.dimensions.bootSpace">
                    </div>
                </div>


                <hr class="my-4">

                <!-- FEATURES -->
                <h5>Features</h5>

                <div class="d-flex gap-2 mb-3">
                    <input class="form-control" placeholder="Add feature" [(ngModel)]="featureInput">

                    <button class="btn btn-outline-primary" (click)="addFeature()">
                        Add
                    </button>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <span class="badge bg-secondary d-flex align-items-center gap-2"
                        *ngFor="let feature of editVehicle.features">

                        {{ feature }}

                        <button class="btn-close btn-close-white btn-sm" (click)="removeFeature(feature)">
                        </button>
                    </span>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button class="btn btn-primary" (click)="updateVehicle()">
                    Update
                </button>
            </div>

        </div>
    </div>
</div>

<app-loader *ngIf="isLoading" class="upper"></app-loader>
