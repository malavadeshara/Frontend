<!-- ================= LOADER OVERLAY ================= -->
<app-loader [show]="showLoader" class="upper"></app-loader>

<!-- ================= FILTERS ================= -->
<div class="filters card p-3 mb-4 shadow-sm">
  <div class="row g-3 align-items-end">

    <div class="col-md-2">
      <label class="form-label">Stock</label>
      <select class="form-select" [(ngModel)]="filters.inStock">
        <option [ngValue]="null">All</option>
        <option [ngValue]="true">In Stock</option>
        <option [ngValue]="false">Sold Out</option>
      </select>
    </div>

    <div class="col-md-2">
      <label class="form-label">Min Price</label>
      <input type="number" class="form-control" [(ngModel)]="filters.minPrice">
    </div>

    <div class="col-md-2">
      <label class="form-label">Max Price</label>
      <input type="number" class="form-control" [(ngModel)]="filters.maxPrice">
    </div>

    <div class="col-md-3">
      <label class="form-label">Sort by Price</label>
      <select class="form-select" [(ngModel)]="filters.sort">
        <option value="">None</option>
        <option value="low">Low → High</option>
        <option value="high">High → Low</option>
      </select>
    </div>

    <div class="col-md-3">
      <button class="btn btn-primary w-100" (click)="applyFilters()">
        Apply Filters
      </button>
    </div>

  </div>
</div>

<!-- ================= HEADER ================= -->
<div class="d-flex justify-content-between align-items-center mb-3" *ngIf="role === 'Admin'">
  <h4 class="mb-0">Vehicle Inventory</h4>

  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
    + Add Vehicle
  </button>
</div>

<!-- ================= VEHICLE GRID ================= -->
<div class="row g-4">

  <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let vehicle of vehicles">
    <app-vehicle-card [vehicle]="vehicle" [role]="role" (updated)="loadVehicles()"
      (delete)="deleteVehicle($event)"></app-vehicle-card>
  </div>

</div>

<!-- ================= PAGINATION ================= -->
<nav class="mt-5 d-flex justify-content-center">
  <ul class="pagination">

    <li class="page-item" [class.disabled]="pageNumber === 1">
      <button class="page-link" (click)="changePage(pageNumber - 1)">
        Previous
      </button>
    </li>

    <li class="page-item" *ngFor="let _ of [].constructor(totalPages); let i = index"
      [class.active]="pageNumber === i + 1">
      <button class="page-link" (click)="changePage(i + 1)">
        {{ i + 1 }}
      </button>
    </li>

    <li class="page-item" [class.disabled]="pageNumber === totalPages">
      <button class="page-link" (click)="changePage(pageNumber + 1)">
        Next
      </button>
    </li>

  </ul>
</nav>

<!-- ================= ADD VEHICLE MODAL ================= -->
<app-create-vehicle-modal (vehicleCreated)="loadVehicles()"></app-create-vehicle-modal>
