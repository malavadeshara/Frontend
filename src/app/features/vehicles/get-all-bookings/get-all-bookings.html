<div class="container-fluid py-4 admin-page">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Booking Management</h2>

        <!-- <a routerLink="" class="btn btn-outline-secondary">
            ← Back to Dashboard
        </a> -->
    </div>


    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item" *ngFor="let s of [1,2,3]">
            <button class="nav-link" [class.active]="activeTab === s" (click)="activeTab = s">
                {{ getStatusLabel(s) }}
                <span class="badge bg-secondary ms-2">
                    {{ getBookingsByStatus(s).length }}
                </span>
            </button>
        </li>
    </ul>

    <!-- Loader -->
    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
    </div>

    <!-- Booking List -->
    <div *ngFor="let item of getBookingsByStatus(activeTab)"
     class="card mb-3 shadow-sm">

  <div class="card-body d-flex justify-content-between align-items-center">

    <div>
      <div><strong>Vehicle:</strong> {{ item.vehicle.name }} ({{ item.vehicle.model }})</div>
      <!-- <div><strong>Year:</strong> {{ item.vehicle.year }}</div> -->
      <div><strong>Date:</strong> {{ item.booking.bookingDate }}</div>
      <div><strong>Slot:</strong> {{ getSlotTime(item.booking.slotIndex) }}</div>
      <div><strong>Price:</strong> {{ item.vehicle.price }} {{ item.vehicle.currency }}</div>
    </div>

    <!-- Actions -->
    <div *ngIf="item.booking.status === 1" class="d-flex gap-2">
      <button
        class="btn btn-success"
        [disabled]="actionLoadingId === item.booking.id"
        (click)="confirmBooking(item.booking.id)">
        Accept
      </button>

      <button
        class="btn btn-danger"
        [disabled]="actionLoadingId === item.booking.id"
        (click)="rejectBooking(item.booking.id)">
        Reject
      </button>
    </div>

    <span *ngIf="item.booking.status !== 1"
          class="badge bg-secondary fs-6">
      {{ getStatusLabel(item.booking.status) }}
    </span>

  </div>
</div>


</div>

<!-- Bootstrap Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="adminToast" class="toast align-items-center text-white bg-{{ toastType }} border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                {{ toastMessage }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
