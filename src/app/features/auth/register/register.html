<app-loader [show]="isLoading"></app-loader>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow register-card">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 text-primary">Register</h3>

            <form [formGroup]="registerForm" (ngSubmit)="submit()">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" formControlName="userName">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" formControlName="email">
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" formControlName="password">
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Register
                </button>

                <div class="text-center mt-3">
                    <span>Already have an account?</span>
                    <a routerLink="/login" class="text-primary fw-semibold ms-1">
                        Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Toast -->
<div *ngIf="showToast" class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast show" [ngClass]="toastClass">
        <div class="toast-body">
            {{ toastMessage }}
        </div>
    </div>
</div>
